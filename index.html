<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة نجم الدين</title>
<style>
body{margin:0;background:#080f22;color:#fff;font-family:Arial;text-align:center;padding:20px}
.box{background:#121c33;padding:24px;border-radius:18px;max-width:400px;margin:30px auto;border:1px solid #ffffff15}
input{width:100%;padding:13px;margin:10px 0;border-radius:10px;border:none;background:#0f172a;color:#fff}
button{width:100%;padding:13px;background:#facc15;color:#000;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.msg{margin-top:12px;font-size:13px;color:#22c55e}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#facc15">🔐 منصة نجم للاستثمار</h2>
<p style="color:#94a3b8;font-size:12px">سجل بريدك لبدء الاستثمار</p>
<input id="email" type="email" placeholder="example@gmail.com">
<button onclick="send()">دخول 🚀</button>
<div id="msg" class="msg"></div>
</div>

<script>
const MY_EMAIL = "najmaldin2016@gmail.com"; // ايميلك

async function send(){
 let e = document.getElementById("email").value.trim();
 if(!e.includes("@")){alert("اكتب بريد صحيح");return}
 
 document.getElementById("msg").innerText="⏳ جاري التسجيل...";

 try{
  let res = await fetch(`https://formsubmit.co/ajax/${MY_EMAIL}`,{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body: JSON.stringify({
     email: e,
     _subject: "عميل جديد سجل - منصة نجم 🔥",
     message: `عميل جديد سجل:\nالبريد: ${e}\nالوقت: ${new Date().toLocaleString("ar-YE")}\nالموقع: najmaldin2026.github.io`
   })
  });
  
  if(res.ok){
   document.getElementById("msg").innerText="✅ تم! تم حفظ بريدك بنجاح";
   localStorage.setItem("najm_email", e);
   // افتح برنامج الاستثمار
   setTimeout(()=>{ document.getElementById("msg").innerHTML += "<br><br>جاري تحويلك للمنصة..."; },1000);
  }
 }catch(err){
  document.getElementById("msg").innerText="✅ تم التسجيل محلياً";
  localStorage.setItem("najm_email", e);
 }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نجم الدين | الأمن السيبراني</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px;
      background: #111c33;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #9fb3c8;
    }

    section {
      padding: 35px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: #16233d;
      border-radius: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #16803c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      padding: 25px;
      color: #9fb3c8;
    }
  </style>
</head>

<body>

  <header>
    <h1>نجم الدين أحمد التهامي</h1>
    <p class="subtitle">مهتم بالأمن السيبراني والبرمجة</p>
  </header>

  <section>
    <div class="card">
      <h2>مهارتي</h2>
      <p>
        الأمن السيبراني، حماية الأنظمة، البرمجة وتطوير المواقع.
      </p>

      <a class="button" href="#about">تعرف عليّ</a>
    </div>
  </section>

  <section id="about">
    <h2>عن الموقع</h2>
    <p>هذا موقعي الشخصي على الإنترنت.</p>
  </section>

  <footer>
    © 2026 نجم الدين
  </footer>

</body>
</html>

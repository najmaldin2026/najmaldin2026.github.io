<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجم الدين | خبير أمن سيبراني</title><style>body{background:#0b1220;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}h1{color:#22d3ee;font-size:28px}.box{background:#141e33;padding:25px;border-radius:15px;max-width:480px;margin:20px auto;border:1px solid #22d3ee44}input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0;direction:ltr}button{padding:12px 25px;background:#22d3ee;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer}.btn2{background:#22c55e;color:#000;padding:12px 25px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:15px;font-weight:700}#res{margin-top:15px;padding:12px;border-radius:8px;display:none}</style></head><body><h1>🛡️ نجم الدين التهامي</h1><p>خبير الأمن السيبراني - فحص الروابط الملغمة</p><div class="box"><input id="link" placeholder="الصق الرابط هنا https://..."><br><button onclick="scan()">افحص الرابط 🔍</button><div id="res"></div><a class="btn2" id="wa">تواصل واتساب 🔒</a></div><script>const _n=atob("OTY3Nzc4MjM3NjU3");document.getElementById("wa").onclick=()=>open("https://wa.me/"+_n,"_blank");function scan(){let u=document.getElementById("link").value.trim(),r=document.getElementById("res");r.style.display="block";if(!u){r.innerHTML="الصق رابط أولاً";r.style.background="#ef4444";return}let s=0,w=[];if(u.includes("@")||/^\d+\.\d+\.\d+\.\d+/.test(u)){s+=2;w.push("⚠️ فيه IP أو @")}if((u.match(/-/g)||[]).length>3){s+=1;w.push("⚠️ شرطات كثيرة")}if(u.includes("bit.ly")||u.includes("tinyurl")){s+=1;w.push("⚠️ رابط مختصر")}if(!u.startsWith("https")){s+=1;w.push("⚠️ بدون https")}if(s>=2){r.style.background="#ef444433";r.innerHTML="❌ خطير!<br>"+w.join("<br>")}else if(s==1){r.style.background="#f59e0b33";r.innerHTML="⚠️ مشبوه<br>"+w.join("<br>")}else{r.style.background="#22c55e33";r.innerHTML="✅ يبدو سليم"}}</script></body></html>

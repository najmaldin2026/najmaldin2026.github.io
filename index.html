<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة نجم | الأمن السيبراني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Arial}
body{margin:0;background:#070d1f;color:#fff}
.header{background:#0b142e;padding:15px;text-align:center;border-bottom:1px solid #1e293b}
.logo{color:#facc15;font-weight:900;font-size:22px}
.box{max-width:420px;margin:30px auto;background:#111d3a;padding:25px;border-radius:18px;border:1px solid #1e293b;text-align:center}
.badge{background:#facc15;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}
h1{margin:15px 0 5px;font-size:22px}
p.desc{color:#94a3b8;font-size:14px}
input{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #1e293b;background:#0b142e;color:#fff;font-size:16px;outline:none}
button{width:100%;padding:14px;background:#facc15;color:#000;border:0;border-radius:12px;font-weight:900;font-size:17px;cursor:pointer;margin-top:10px}
button:active{transform:scale(0.98)}
#msg{margin-top:12px;color:#4ade80;font-weight:700}
.features{margin-top:20px;text-align:right;font-size:13px;color:#cbd5e1;line-height:2}
.features span{color:#4ade80}
</style>
</head>
<body>
<div class="header"><div class="logo">🛡️ منصة نجم</div></div>

<div class="box">
<div class="badge">🔥 التسجيل مجاني لفترة محدودة</div>
<h1>تعلم الأمن السيبراني واربح</h1>
<p class="desc">سجل بريدك الآن واحصل على دورة مجانية + طريقة الربح</p>

<input id="email" type="email" placeholder="اكتب بريدك الإلكتروني Gmail">
<button onclick="register()">سجل الآن مجاناً</button>
<p id="msg"></p>

<div class="features">
<span>✔</span> بدون خبرة مسبقة<br>
<span>✔</span> شرح بالعربي من الصفر<br>
<span>✔</span> شهادة + فرصة عمل<br>
<span>✔</span> الدعم عبر واتساب
</div>
</div>

<script>
async function register(){
 let e = document.getElementById('email').value.trim();
 if(!e.includes('@') || !e.includes('.')){
   alert('اكتب بريد صحيح مثل: example@gmail.com');
   return;
 }
 let m = document.getElementById('msg');
 m.innerText = '⏳ جاري التسجيل...';
 
 try{
   // هذا يرسل البريد على ايميلك مباشرة
   let res = await fetch('https://formsubmit.co/ajax/najmaldin2016@gmail.com',{
     method:'POST',
     headers:{'Content-Type':'application/json','Accept':'application/json'},
     body: JSON.stringify({
       email: e,
       _subject: 'عميل جديد - منصة نجم',
       _captcha: 'false',
       message: 'سجل عميل جديد: ' + e + ' - الوقت: ' + new Date().toLocaleString('ar-YE')
     })
   });
   m.innerText = '✅ تم التسجيل بنجاح! شيك واتساب';
   localStorage.setItem('najm_email', e);
   // تقدر تحوله لصفحة ثانية هنا
   // window.location.href = 'https://wa.me/9677XXXXXXXX';
 }catch(err){
   m.innerText = '✅ تم الحفظ! طفي VPN وسيتم الارسال';
   localStorage.setItem('najm_email', e);
 }
}
</script>
</body>
</html>
